<button
  type="button"
  data-password-toggle
  data-show-label="{{ show_label|default:'Show password' }}"
  data-hide-label="{{ hide_label|default:'Hide password' }}"
  aria-label="{{ show_label|default:'Show password' }}"
  aria-pressed="false"
  class="absolute inset-y-0 right-0 flex items-center px-3 text-outline hover:text-primary focus:outline-none focus-visible:text-primary transition-colors"
>
  <span class="material-symbols-outlined text-[18px]" aria-hidden="true" data-password-toggle-icon>visibility</span>
</button>
